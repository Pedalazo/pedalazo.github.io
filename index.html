<!doctype html>
<!-- Cuando el juego esté en las tiendas, agrega aquí los enlaces al App Store y a Google Play. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedalazo</title>
<style>
  :root { --ink: #17214d; --muted: #57608c; --card: #fff8e1; --yellow: #f6c21a; --red: #e03a2b; }
  body { margin: 0; background: var(--card); color: var(--ink); font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img { width: 160px; height: 160px; border-radius: 36px; box-shadow: 0 6px 0 var(--ink); }
  h1 { font-size: 44px; margin: 24px 0 4px; letter-spacing: 1px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  .links { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  a { color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="icono.png" alt="Pedalazo">
  <h1>PEDALAZO</h1>
  <p>Carreras de bici con tres botones: ataca en las subidas, salta charcos y gana al sprint.</p>
  <p class="muted">Bike racing with three buttons: attack the climbs, jump the puddles and win the sprint.</p>
  <div class="links">
    <!-- Cuando el juego ya se pueda bajar de Google Play, quita los signos de comentario de la línea siguiente: -->
    <!-- <a href="https://play.google.com/store/apps/details?id=com.arg.pedalazo">Descárgalo en Google Play · Get it on Google Play</a> -->
    <a href="privacidad/">Política de privacidad · Privacy policy</a>
    <span>Contacto · Contact: <a href="mailto:pedalazogame@gmail.com">pedalazogame@gmail.com</a></span>
  </div>
</main>
</body>
</html>
